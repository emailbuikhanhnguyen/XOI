<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sổ Xôi — Chấm công &amp; Doanh thu</title>
<meta name="description" content="Sổ tay chấm công, tính lương, quản lý bếp trung tâm, điểm bán, nguyên liệu và doanh thu cho quán xôi" />
<meta name="theme-color" content="#3F6B4A" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- ======================= MÀN HÌNH ĐĂNG NHẬP ======================= -->
<section id="screen-login" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34"><path d="M24 4c8 6 15 13 15 22a15 15 0 0 1-30 0C9 17 16 10 24 4Z" fill="currentColor"/></svg>
      </span>
      <div class="brand-text">
        <h1>Sổ Xôi</h1>
        <p>Bếp trung tâm · Điểm bán · Lương · Nguyên liệu · Doanh thu</p>
      </div>
    </div>

    <form id="form-login" class="stack" autocomplete="on">
      <label class="field">
        <span>Email</span>
        <input type="email" id="login-email" required autocomplete="username" placeholder="ban@quanxoi.vn" />
      </label>
      <label class="field">
        <span>Mật khẩu</span>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
      </label>
      <p id="login-error" class="error-text" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      <button type="button" id="btn-forgot-password" class="link-btn" style="margin:2px auto 0;">Quên mật khẩu?</button>
    </form>

    <p class="login-hint">Chưa có tài khoản? Nhờ chủ quán tạo tài khoản cho bạn trong mục <em>Quản lý</em>.</p>
  </div>
</section>

<!-- ======================= ỨNG DỤNG CHÍNH ======================= -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-mark small" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="22" height="22"><path d="M24 4c8 6 15 13 15 22a15 15 0 0 1-30 0C9 17 16 10 24 4Z" fill="currentColor"/></svg>
      </span>
      <span class="topbar-title" id="view-title">Trang chủ</span>
    </div>
    <div class="topbar-right">
      <span id="user-chip" class="user-chip"></span>
      <button id="btn-help" class="icon-btn" title="Hướng dẫn sử dụng" aria-label="Hướng dẫn sử dụng">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
      <button id="btn-logout" class="icon-btn" title="Đăng xuất" aria-label="Đăng xuất">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div id="network-banner" class="network-banner" hidden>
    Mất kết nối mạng — vẫn thao tác bình thường, dữ liệu sẽ tự đồng bộ khi có mạng lại.
  </div>

  <main id="view-root" class="view-root"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item" data-view="trang-chu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Trang chủ</span>
    </button>
    <button class="nav-item" data-view="cham-cong">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span>Chấm công</span>
    </button>
    <button class="nav-item" data-view="kho">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14l-1 6a6 6 0 0 1-12 0L5 3Z"/><path d="M9 21h6M12 15v6"/></svg>
      <span>Kho</span>
    </button>
    <button class="nav-item" data-view="thu-chi" data-admin-only="1">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Thu chi</span>
    </button>
    <button class="nav-item" data-view="bao-cao" data-admin-only="1">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Báo cáo</span>
    </button>
    <button class="nav-item" data-view="quan-ly" data-admin-only="1">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3-6 7-6s7 2.7 7 6"/><circle cx="18" cy="8" r="2.3"/><path d="M23 20c0-2.6-2-4.8-5-5.6"/></svg>
      <span>Quản lý</span>
    </button>
  </nav>
</div>

<!-- ======================= TEMPLATES ======================= -->

<template id="tpl-trang-chu">
  <section class="view">
    <div data-bind="home-reminders"></div>
    <div class="ticket ticket-hero">
      <p class="eyebrow">Hôm nay</p>
      <h2 class="hero-date" data-bind="today-date"></h2>
      <div class="hero-stats" data-bind="hero-stats"></div>
    </div>
    <div class="section-block" data-bind="quick-actions"></div>
    <div class="stat-grid" data-bind="home-by-location"></div>
    <div data-bind="location-leaderboard"></div>

    <div data-bind="attendance-block" hidden>
      <div class="section-row">
        <h3 class="section-heading">Điểm danh chấm công</h3>
        <input type="date" id="attendance-date" class="select-chip" />
      </div>
      <div data-bind="attendance-summary"></div>
      <div class="stack" data-bind="attendance-list"></div>
    </div>

    <h3 class="section-heading">Gần đây</h3>
    <div class="stack" data-bind="recent-list"></div>
  </section>
</template>

<template id="tpl-cham-cong">
  <section class="view">
    <div class="ticket" style="margin-bottom:12px;" data-bind="entry-staff-select" hidden></div>
    <form id="form-entry" class="ticket ticket-form">
      <p class="eyebrow">Phiếu chấm công · <span data-bind="entry-location"></span></p>
      <div class="grid-2">
        <label class="field">
          <span>Ngày</span>
          <input type="date" id="entry-date" required />
        </label>
        <label class="field field-check">
          <input type="checkbox" id="entry-off" />
          <span>Nghỉ hôm nay</span>
        </label>
      </div>
      <div class="grid-2" id="entry-work-fields">
        <label class="field">
          <span>Lương cơ bản (đ)</span>
          <input type="number" inputmode="numeric" id="entry-luong" min="0" step="1000" />
        </label>
        <label class="field">
          <span>Số lượng bán</span>
          <input type="number" inputmode="numeric" id="entry-soluong" min="0" step="1" />
        </label>
        <label class="field">
          <span>Thưởng (đ)</span>
          <input type="number" inputmode="numeric" id="entry-thuong" min="0" step="1000" />
        </label>
        <label class="field">
          <span>Tổng (đ)</span>
          <input type="number" inputmode="numeric" id="entry-tong" min="0" step="1000" />
        </label>
        <label class="field">
          <span>Số đơn ship</span>
          <input type="number" inputmode="numeric" id="entry-ship" min="0" step="1" />
        </label>
        <label class="field">
          <span>Số xôi ship / dẹp</span>
          <input type="number" inputmode="numeric" id="entry-dep" min="0" step="1" />
        </label>
      </div>
      <label class="field">
        <span>Ghi chú</span>
        <textarea id="entry-ghichu" rows="2" placeholder="VD: 8c ship, giữ 100k thối..."></textarea>
      </label>
      <div class="ticket-actions">
        <button type="button" id="btn-entry-cancel" class="btn btn-ghost" hidden>Huỷ sửa</button>
        <button type="submit" class="btn btn-primary">Lưu phiếu</button>
      </div>
    </form>

    <div class="section-row">
      <h3 class="section-heading">Lịch sử</h3>
      <select id="entry-filter" class="select-chip">
        <option value="7">7 ngày qua</option>
        <option value="30" selected>30 ngày qua</option>
        <option value="90">3 tháng qua</option>
      </select>
    </div>
    <div class="search-row"><input type="search" id="entry-search" placeholder="Tìm theo tên / ghi chú…" /></div>
    <div class="stack" data-bind="entry-list"></div>
    <button type="button" class="btn btn-ghost btn-loadmore" data-bind="entry-list-more" hidden>Xem thêm</button>
  </section>
</template>

<template id="tpl-kho">
  <section class="view">
    <div data-bind="kho-readonly" hidden>
      <h3 class="section-heading">Nguyên vật liệu dùng cho điểm bán</h3>
      <div class="stack" data-bind="pos-item-list"></div>

      <form id="form-order" class="ticket ticket-form">
        <p class="eyebrow">Đặt hàng nguyên liệu từ bếp</p>
        <div class="grid-2">
          <label class="field">
            <span>Ngày cần</span>
            <input type="date" id="order-date" required />
          </label>
          <label class="field">
            <span>Đơn vị</span>
            <input type="text" id="order-unit" list="unit-suggestions" value="kg" placeholder="VD: kg" />
          </label>
        </div>
        <label class="field">
          <span>Nguyên liệu / mặt hàng cần</span>
          <input type="text" id="order-item" list="order-item-suggestions" placeholder="VD: Gạo nếp" required />
        </label>
        <label class="field">
          <span>Số lượng</span>
          <input type="number" inputmode="decimal" id="order-qty" min="0" step="0.1" required />
        </label>
        <label class="field">
          <span>Ghi chú</span>
          <input type="text" id="order-ghichu" placeholder="VD: cần gấp trước 10h sáng" />
        </label>
        <div class="ticket-actions">
          <button type="submit" class="btn btn-primary">Gửi yêu cầu</button>
        </div>
      </form>

      <h3 class="section-heading">Đơn đã đặt</h3>
      <div class="stack" data-bind="order-list"></div>

      <h3 class="section-heading">Đã nhận từ bếp trung tâm</h3>
      <div class="stack" data-bind="received-list"></div>
    </div>

    <div data-bind="kho-manage" hidden>
      <div class="ticket" style="margin-bottom:12px;" data-bind="kitchen-select"></div>

      <h3 class="section-heading">Gợi ý chuẩn bị hôm nay</h3>
      <p class="hint-text">Ước tính theo số lượng bán trung bình các ngày cùng Thứ gần đây — chỉ mang tính tham khảo, không thay thế kinh nghiệm thực tế.</p>
      <div class="stack" data-bind="prep-suggestion"></div>

      <h3 class="section-heading">Yêu cầu nguyên liệu từ điểm bán</h3>
      <div class="stack" data-bind="order-requests-list"></div>

      <form id="form-ing" class="ticket ticket-form">
        <p class="eyebrow">Nhập nguyên liệu vào bếp</p>
        <div class="grid-2">
          <label class="field">
            <span>Ngày</span>
            <input type="date" id="ing-date" required />
          </label>
          <label class="field">
            <span>Đơn vị</span>
            <input type="text" id="ing-unit" list="unit-suggestions" value="kg" placeholder="VD: kg" />
          </label>
        </div>
        <label class="field">
          <span>Nguyên liệu</span>
          <input type="text" id="ing-item" list="item-suggestions" placeholder="VD: Gà" required />
        </label>
        <div class="grid-2">
          <label class="field">
            <span>Số lượng</span>
            <input type="number" inputmode="decimal" id="ing-qty" min="0" step="0.1" required />
          </label>
          <label class="field">
            <span>Thành tiền (đ)</span>
            <input type="number" inputmode="numeric" id="ing-tien" min="0" step="1000" />
          </label>
        </div>
        <div class="grid-2">
          <label class="field">
            <span>Hạn sử dụng (tuỳ chọn)</span>
            <input type="date" id="ing-hansudung" />
          </label>
          <label class="field">
            <span>Nhà cung cấp (tuỳ chọn)</span>
            <input type="text" id="ing-ncc" placeholder="VD: Vựa gạo Cô Ba" />
          </label>
        </div>
        <label class="field-check">
          <input type="checkbox" id="ing-congno" />
          <span>Còn nợ nhà cung cấp (chưa trả tiền)</span>
        </label>
        <label class="field">
          <span>Ghi chú</span>
          <input type="text" id="ing-ghichu" placeholder="VD: đã thanh toán" />
        </label>
        <label class="field">
          <span>Ảnh hoá đơn (tuỳ chọn)</span>
          <input type="file" accept="image/*" capture="environment" id="ing-anh" />
        </label>
        <div class="receipt-input-row" id="ing-anh-row" hidden>
          <img class="receipt-preview" id="ing-anh-preview" alt="Ảnh hoá đơn" />
          <button type="button" class="link-btn danger" id="ing-anh-clear">Xoá ảnh</button>
        </div>
        <div class="ticket-actions">
          <button type="button" id="btn-ing-cancel" class="btn btn-ghost" hidden>Huỷ sửa</button>
          <button type="submit" class="btn btn-primary">Lưu nguyên liệu</button>
        </div>
      </form>
      <h3 class="section-heading">Lịch sử nhập hàng</h3>
      <div class="search-row"><input type="search" id="ing-search" placeholder="Tìm theo tên nguyên liệu / ghi chú…" /></div>
      <div class="stack" data-bind="ing-list"></div>
      <button type="button" class="btn btn-ghost btn-loadmore" data-bind="ing-list-more" hidden>Xem thêm</button>

      <div data-bind="supplier-debt-wrap" hidden>
        <h3 class="section-heading">Công nợ nhà cung cấp</h3>
        <div class="table-wrap" data-bind="supplier-debt-table"></div>
      </div>

      <form id="form-trf" class="ticket ticket-form" style="margin-top:18px;">
        <p class="eyebrow">Chuyển hàng cho điểm bán</p>
        <div class="grid-2">
          <label class="field">
            <span>Ngày</span>
            <input type="date" id="trf-date" required />
          </label>
          <label class="field">
            <span>Điểm bán nhận</span>
            <select id="trf-to"></select>
          </label>
        </div>
        <div class="grid-2">
          <label class="field">
            <span>Mặt hàng</span>
            <input type="text" id="trf-item" list="item-suggestions" placeholder="VD: Xôi gói sẵn" required />
          </label>
          <label class="field">
            <span>Đơn vị</span>
            <input type="text" id="trf-unit" list="unit-suggestions" value="phần" placeholder="VD: phần" />
          </label>
        </div>
        <label class="field">
          <span>Số lượng</span>
          <input type="number" inputmode="decimal" id="trf-qty" min="0" step="0.1" required />
        </label>
        <label class="field">
          <span>Ghi chú</span>
          <input type="text" id="trf-ghichu" placeholder="VD: chuyến sáng" />
        </label>
        <div class="ticket-actions">
          <button type="button" id="btn-trf-cancel" class="btn btn-ghost" hidden>Huỷ sửa</button>
          <button type="submit" class="btn btn-primary">Lưu chuyển hàng</button>
        </div>
      </form>
      <h3 class="section-heading">Lịch sử chuyển hàng</h3>
      <div class="search-row"><input type="search" id="trf-search" placeholder="Tìm theo tên hàng / điểm nhận / ghi chú…" /></div>
      <div class="stack" data-bind="trf-list"></div>
      <button type="button" class="btn btn-ghost btn-loadmore" data-bind="trf-list-more" hidden>Xem thêm</button>

      <div class="section-row">
        <h3 class="section-heading">Tồn kho hiện tại</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="kho-loai-filter" class="select-chip">
            <option value="tatca">Tất cả</option>
            <option value="sanxuat">Sản xuất</option>
            <option value="diemban">Điểm bán</option>
          </select>
          <button type="button" class="link-btn" data-bind="stocktake-toggle">Kiểm kê kho</button>
        </div>
      </div>
      <div class="table-wrap" data-bind="stock-table"></div>

      <div data-bind="stocktake-section" hidden>
        <h3 class="section-heading">Kiểm kê kho (đối chiếu tồn thực tế)</h3>
        <p class="hint-text">Nhập số đếm được thực tế cho từng nguyên liệu — dùng để nhập tồn kho ban đầu (khi mới bắt đầu dùng app) hoặc đối chiếu định kỳ. Hệ thống tự tính chênh lệch và ghi 1 dòng "nhập nguyên liệu" điều chỉnh (âm hoặc dương) cho từng nguyên liệu bạn Lưu. Tick "SX"/"ĐB" để đánh dấu nguyên liệu dùng cho sản xuất và/hoặc dùng cho điểm bán (1 nguyên liệu có thể thuộc cả 2) — lưu ngay khi tick, dùng để lọc ở ô "Tất cả/Sản xuất/Điểm bán" phía trên.</p>
        <div class="table-wrap" data-bind="stocktake-table"></div>
        <div class="grid-2" style="margin-top:14px;">
          <label class="field">
            <span>Thêm nguyên liệu khác vào danh sách</span>
            <input type="text" id="stocktake-new-item" list="item-suggestions" placeholder="VD: Muối" />
          </label>
          <label class="field">
            <span>Đơn vị</span>
            <input type="text" id="stocktake-new-unit" list="unit-suggestions" value="kg" placeholder="VD: kg" />
          </label>
        </div>
        <div class="ticket-actions">
          <button type="button" class="btn btn-ghost" id="btn-stocktake-add">+ Thêm vào danh sách kiểm kê</button>
        </div>

        <h3 class="section-heading" style="margin-top:18px;">Các lần điều chỉnh kiểm kê gần đây</h3>
        <p class="hint-text">Sửa/xoá ngay tại đây nếu lỡ nhập nhầm khi kiểm kê.</p>
        <div class="stack" data-bind="stocktake-history"></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-thu-chi">
  <section class="view">
    <form id="form-thuchi" class="ticket ticket-form">
      <p class="eyebrow">Ghi nhận khoản thu / chi</p>
      <div class="grid-2">
        <label class="field">
          <span>Loại</span>
          <select id="tc-loai">
            <option value="thu">Khoản thu</option>
            <option value="chi" selected>Khoản chi</option>
          </select>
        </label>
        <label class="field">
          <span>Ngày</span>
          <input type="date" id="tc-date" required />
        </label>
      </div>
      <label class="field">
        <span>Danh mục</span>
        <input type="text" id="tc-danhmuc" list="thuchi-suggestions" placeholder="VD: Tiền mặt bằng" required />
      </label>
      <div class="grid-2">
        <label class="field">
          <span>Số tiền (đ)</span>
          <input type="number" inputmode="numeric" id="tc-sotien" min="0" step="1000" required />
        </label>
        <label class="field">
          <span>Điểm liên quan</span>
          <select id="tc-location"></select>
        </label>
      </div>
      <label class="field">
        <span>Ghi chú</span>
        <input type="text" id="tc-ghichu" placeholder="VD: Thanh toán tiền điện tháng 8" />
      </label>
      <label class="field">
        <span>Ảnh hoá đơn (tuỳ chọn)</span>
        <input type="file" accept="image/*" capture="environment" id="tc-anh" />
      </label>
      <div class="receipt-input-row" id="tc-anh-row" hidden>
        <img class="receipt-preview" id="tc-anh-preview" alt="Ảnh hoá đơn" />
        <button type="button" class="link-btn danger" id="tc-anh-clear">Xoá ảnh</button>
      </div>
      <div class="ticket-actions">
        <button type="button" id="btn-tc-cancel" class="btn btn-ghost" hidden>Huỷ sửa</button>
        <button type="submit" class="btn btn-primary">Lưu giao dịch</button>
      </div>
    </form>

    <div class="ticket">
      <p class="eyebrow">Khoảng thời gian &amp; bộ lọc</p>
      <div class="grid-2">

<template id="tpl-huong-dan">
  <section class="view">
    <div class="ticket ticket-hero">
      <p class="eyebrow">Hướng dẫn</p>
      <h2 class="hero-date">Cách dùng Sổ Xôi</h2>
      <p style="margin:0; font-size:13.5px; line-height:1.6; color:rgba(255,252,245,0.92);">
        Bấm vào từng mục bên dưới để xem chi tiết. Không cần hỏi chủ quán — tự
        tra ở đây trước, phần nào máy vẫn không rõ thì mới cần hỏi thêm.
      </p>
    </div>

    <details class="ticket help-card" open>
      <summary>1. Tổng quan chung</summary>
      <div class="help-body">
        <p>Sổ Xôi dùng để ghi chấm công/doanh số, quản lý kho nguyên liệu, chuyển
        hàng giữa bếp trung tâm và các điểm bán, thu chi, và báo cáo doanh thu —
        thay cho sổ tay giấy.</p>
        <p>App có 2 vai trò:</p>
        <ul>
          <li><strong>Nhân viên</strong>: chỉ thấy 3 mục dưới cùng màn hình —
          <em>Trang chủ, Chấm công, Kho</em>. Chỉ thao tác được cho điểm/bếp mình
          đang làm việc.</li>
          <li><strong>Chủ quán (quản trị)</strong>: thấy đủ 6 mục, gồm thêm
          <em>Thu chi, Báo cáo, Quản lý</em>, và xem được số liệu của mọi
          điểm bán.</li>
        </ul>
        <p>Điều hướng bằng thanh menu dưới cùng màn hình. Góc trên bên phải có
        biểu tượng đăng xuất; nếu bạn thấy nút <strong>?</strong> cạnh đó thì đó
        chính là menu hướng dẫn này.</p>
        <p><strong>Dùng được cả khi mất mạng</strong>: khi không có Internet, app
        vẫn cho nhập phiếu bình thường (có dải màu báo "Mất kết nối mạng" phía
        trên), dữ liệu tự đồng bộ lên khi có mạng lại — không cần nhập lại.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>2. Đăng nhập, quên mật khẩu, đăng xuất</summary>
      <div class="help-body">
        <p><strong>Đăng nhập</strong>: dùng email + mật khẩu do chủ quán tạo cho
        bạn (mục Quản lý &gt; Nhân viên). Chưa có tài khoản thì nhờ chủ quán tạo,
        không tự đăng ký được.</p>
        <p><strong>Lần đầu nhận tài khoản</strong>: hệ thống gửi email cho bạn tự
        đặt mật khẩu — kiểm tra cả hộp thư rác (spam) nếu không thấy email.</p>
        <p><strong>Quên mật khẩu</strong>: ở màn đăng nhập, bấm "Quên mật khẩu?",
        nhập email, hệ thống gửi link đặt lại mật khẩu qua email đó.</p>
        <p><strong>Đăng xuất</strong>: bấm biểu tượng cửa ở góc trên bên phải màn
        hình.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>3. Trang chủ</summary>
      <div class="help-body">
        <p>Hiện nhanh tình hình hôm nay: số liệu tổng hợp (doanh số/lương/thưởng
        tuỳ vai trò), các nút thao tác nhanh, và danh sách phiếu gần đây.</p>
        <p>Nếu quán có từ 2 điểm bán trở lên, có thêm bảng <strong>"Xếp hạng
        điểm bán tuần này"</strong> — xếp theo doanh thu tuần hiện tại (tính từ
        Thứ Hai), giúp anh em biết điểm nào đang bán tốt.</p>
        <p>Chủ quán còn thấy thêm khối <strong>"Điểm danh chấm công"</strong> —
        xem nhanh điểm/nhân viên nào đã chấm công ngày đang chọn, điểm/nhân viên
        nào chưa.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>4. Chấm công</summary>
      <div class="help-body">
        <p>Mỗi ngày làm việc, tạo 1 <strong>phiếu chấm công</strong> mới:</p>
        <ul>
          <li>Chọn ngày (mặc định hôm nay, chỉ chọn được trong khoảng gần đây,
          không chọn được ngày tương lai).</li>
          <li>Nếu hôm đó nghỉ, tick <strong>"Nghỉ hôm nay"</strong> — các ô
          lương/số lượng/thưởng sẽ ẩn đi, không cần điền.</li>
          <li>Nếu đi làm: điền lương cơ bản, số lượng bán, thưởng, tổng tiền, số
          đơn ship, số xôi ship/dẹp — ghi chú thêm nếu cần (VD: tiền thối, đổi
          ca...).</li>
        </ul>
        <p>App tự chặn <strong>tạo 2 phiếu cùng ngày cho cùng 1 điểm/nhân viên</strong>
        — nếu thấy báo lỗi trùng ngày, nghĩa là hôm đó đã có phiếu rồi, vào phần
        Lịch sử bên dưới để sửa phiếu cũ thay vì tạo phiếu mới.</p>
        <p>Phần <strong>Lịch sử</strong> phía dưới cho xem lại/sửa/xoá các phiếu
        đã lưu, lọc theo 7 ngày / 30 ngày / 3 tháng, và tìm theo tên hoặc ghi
        chú.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>5. Kho &amp; Chuyển hàng — dành cho điểm bán</summary>
      <div class="help-body">
        <p>Nếu tài khoản của bạn gắn với 1 <em>điểm bán</em>, màn Kho sẽ hiện:</p>
        <ul>
          <li><strong>Nguyên vật liệu dùng cho điểm bán</strong>: xem nhanh
          những gì điểm đang có.</li>
          <li><strong>Đặt hàng nguyên liệu từ bếp</strong>: gửi yêu cầu bếp
          trung tâm chuẩn bị nguyên liệu/mặt hàng gì, ngày cần, số lượng — bếp sẽ
          thấy yêu cầu này ở màn Kho của họ.</li>
          <li><strong>Đơn đã đặt</strong>: theo dõi các yêu cầu mình đã gửi, còn
          chờ hay đã được xử lý.</li>
          <li><strong>Đã nhận từ bếp trung tâm</strong>: lịch sử các lần bếp
          chuyển hàng xuống điểm mình.</li>
        </ul>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>6. Kho &amp; Chuyển hàng — dành cho bếp trung tâm</summary>
      <div class="help-body">
        <p>Nếu tài khoản gắn với <em>bếp trung tâm</em> (hoặc bạn là chủ quán),
        màn Kho có đầy đủ các phần quản lý:</p>
        <p><strong>Gợi ý chuẩn bị hôm nay</strong>: app tự ước tính mỗi điểm bán
        nên chuẩn bị bao nhiêu, dựa trên trung bình số lượng bán các ngày
        <em>cùng Thứ</em> trong khoảng gần đây (VD: gợi ý cho Thứ Ba lấy trung
        bình các Thứ Ba trước đó). Chỉ là <strong>tham khảo</strong>, không thay
        thế kinh nghiệm thực tế — điểm mới mở hoặc chưa đủ dữ liệu sẽ chưa có gợi
        ý.</p>
        <p><strong>Yêu cầu nguyên liệu từ điểm bán</strong>: xem các đơn điểm
        bán vừa gửi lên.</p>
        <p><strong>Nhập nguyên liệu vào bếp</strong>: mỗi lần mua nguyên liệu về,
        tạo 1 phiếu nhập gồm tên, số lượng, đơn vị, thành tiền. Có thêm 2 ô tuỳ
        chọn:</p>
        <ul>
          <li><strong>Hạn sử dụng</strong>: nếu điền, app sẽ tự cảnh báo khi
          nguyên liệu đó sắp hết hạn (còn ≤ 3 ngày) ở bảng "Tồn kho hiện tại"
          bên dưới.</li>
          <li><strong>Nhà cung cấp</strong> + tick <strong>"Còn nợ nhà cung
          cấp"</strong>: nếu mua nợ chưa trả tiền ngay, điền tên nhà cung cấp và
          tick ô này — khoản này sẽ tự cộng vào bảng "Công nợ nhà cung cấp".</li>
        </ul>
        <p>Có thể đính kèm ảnh hoá đơn. Phần <strong>Lịch sử nhập hàng</strong>
        cho sửa/xoá lại các phiếu đã lưu.</p>
        <p><strong>Công nợ nhà cung cấp</strong>: bảng này chỉ hiện khi có
        khoản nợ chưa trả — gộp theo từng nhà cung cấp, tổng tiền còn nợ. Ở
        từng phiếu nhập hàng đang nợ, bấm <strong>"Đánh dấu đã trả"</strong> khi
        đã thanh toán xong, khoản đó sẽ hết tính vào công nợ.</p>
        <p><strong>Chuyển hàng cho điểm bán</strong>: khi bếp chuẩn bị xong, tạo
        phiếu chuyển hàng — chọn điểm bán nhận, mặt hàng, số lượng. Phiếu này sẽ
        hiện bên "Đã nhận từ bếp trung tâm" ở màn Kho của điểm bán đó.</p>
        <p><strong>Tồn kho hiện tại</strong>: bảng tổng hợp còn bao nhiêu mỗi
        nguyên liệu, lọc theo "Sản xuất"/"Điểm bán". Dòng nào tồn kho thấp hoặc
        <strong>âm</strong> (nhập/chuyển vượt quá số thực tế có — thường do nhập
        nhầm số) sẽ được tô màu cảnh báo.</p>
        <p><strong>Kiểm kê kho</strong>: bấm nút này khi cần đối chiếu tồn kho
        thực tế (mới bắt đầu dùng app, hoặc kiểm kê định kỳ). Nhập số đếm được
        thực tế cho từng nguyên liệu, app tự tính chênh lệch và ghi phiếu điều
        chỉnh — không cần tự tính tay.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>7. Thu &amp; chi (chỉ chủ quán)</summary>
      <div class="help-body">
        <p>Ghi các khoản thu/chi ngoài doanh thu bán xôi hàng ngày — VD: tiền
        mặt bằng, điện nước, sửa chữa, marketing... Chọn loại (thu/chi), ngày,
        danh mục, số tiền, điểm liên quan (nếu có), có thể đính kèm ảnh hoá đơn.</p>
        <p>Phía dưới có bộ lọc theo khoảng ngày/loại/điểm, các nút lọc nhanh
        "Tuần này/Tháng này/7 ngày", và danh sách giao dịch có thể tìm kiếm,
        sửa, xoá.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>8. Báo cáo (chỉ chủ quán)</summary>
      <div class="help-body">
        <p>Chọn khoảng ngày và điểm bán muốn xem, gồm:</p>
        <ul>
          <li>Tổng hợp số liệu chung, doanh thu/lợi nhuận theo từng điểm bán,
          theo từng nhân viên.</li>
          <li>Biểu đồ doanh thu/lợi nhuận theo tháng.</li>
          <li><strong>Quyết toán theo tuần</strong>: mỗi phiếu là tổng lương 1
          tuần của 1 nhân viên — tick "Đã thanh toán tuần này" sau khi trả
          lương xong để theo dõi tuần nào đã trả, tuần nào chưa (lọc bằng 3 nút
          Tất cả/Chưa thanh toán/Đã thanh toán). Chỉ hiện các tuần có phiếu
          chấm công trong khoảng ngày đang lọc phía trên — chọn khoảng rộng hơn
          (VD "Tháng này") để thấy nhiều tuần cùng lúc.</li>
        </ul>
        <p>Cuối trang có nút <strong>Xuất CSV</strong> (mở bằng Excel) và
        <strong>Xuất PDF</strong> để lưu/in báo cáo.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>9. Quản lý (chỉ chủ quán)</summary>
      <div class="help-body">
        <p><strong>Điểm bán &amp; bếp trung tâm</strong>: thêm/sửa từng điểm —
        tên, loại (Bếp trung tâm hoặc Điểm bán), địa chỉ, giá bán mỗi phần xôi
        (dùng để tính doanh thu tự động ở Báo cáo/Trang chủ), lương cơ bản mặc
        định mỗi ngày.</p>
        <p><strong>Nhân viên</strong>: tạo tài khoản mới cho nhân viên — họ tên,
        email đăng nhập, vai trò (Nhân viên hoặc Chủ quán), điểm làm việc. Không
        cần đặt mật khẩu tạm, hệ thống tự gửi email cho nhân viên tự đặt mật khẩu
        lần đầu đăng nhập.</p>
        <p>Có 2 nút "Xoá tất cả điểm TEST" / "Dọn toàn bộ dữ liệu TEST" — chỉ
        dùng khi đang thử nghiệm app, <strong>không bấm khi đã có dữ liệu thật
        đang dùng</strong> vì sẽ xoá dữ liệu test đã tạo trước đó.</p>
      </div>
    </details>

    <details class="ticket help-card">
      <summary>10. Câu hỏi thường gặp / Xử lý sự cố</summary>
      <div class="help-body">
        <p><strong>Không đăng nhập được?</strong> Kiểm tra đúng email, thử
        "Quên mật khẩu?" để đặt lại. Vẫn không được thì nhờ chủ quán kiểm tra
        tài khoản trong mục Quản lý.</p>
        <p><strong>Nhập phiếu mà không thấy lưu / báo lỗi mạng?</strong> App vẫn
        lưu tạm trên máy và tự đồng bộ khi có mạng lại — cứ tiếp tục dùng bình
        thường, đừng nhập lại nhiều lần. Nếu dải báo "Mất kết nối mạng" biến mất
        nghĩa là đã có mạng lại.</p>
        <p><strong>Không thấy mục Thu chi / Báo cáo / Quản lý?</strong> 3 mục
        này chỉ dành cho chủ quán (quản trị) — tài khoản nhân viên sẽ không thấy.</p>
        <p><strong>Không sửa/xoá được 1 phiếu nào đó?</strong> Thường do phiếu
        đó do người khác tạo hoặc đã quá cũ — liên hệ chủ quán để được hỗ trợ
        sửa/xoá.</p>
        <p><strong>Số liệu hiển thị có vẻ sai/cũ?</strong> Thử tải lại trang
        (kéo màn hình xuống hoặc bấm nút tải lại của trình duyệt). App luôn ưu
        tiên tải bản mới nhất khi có mạng.</p>
        <p>Vẫn còn thắc mắc thì hỏi trực tiếp chủ quán hoặc người quản lý app.</p>
      </div>
    </details>
